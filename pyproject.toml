[build-system]
requires = [
  "hatchling>=1.21.0",
  "hatch-nodejs-version>=0.3.2",
  "hatch-jupyter-builder>=0.9.1",
  "jupyterlab>=4.0.0,<5"
]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-run-python"
description = "JupyterLab extension to run Python scripts from editor and file browser."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "bmharris" }
]
classifiers = [
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Framework :: Jupyter :: JupyterLab :: 4",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dynamic = ["version"]
dependencies = [
  "jupyterlab>=4.0.0,<5"
]

[project.urls]
Homepage = "https://github.com/bmharris626/jupyter-run-python"

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.targets.wheel]
packages = ["jupyterlab_run_python"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_run_python/labextension" = "share/jupyter/labextensions/jupyterlab-run-python"
"install.json" = "share/jupyter/labextensions/jupyterlab-run-python/install.json"

[tool.hatch.build.targets.sdist]
artifacts = [
  "jupyterlab_run_python/labextension",
  "install.json"
]
exclude = [
  "node_modules",
  ".git*"
]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.9.1"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
  "jupyterlab_run_python/labextension/package.json"
]
skip-if-exists = [
  "jupyterlab_run_python/labextension/package.json"
]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:labextension"
npm = ["npm"]
